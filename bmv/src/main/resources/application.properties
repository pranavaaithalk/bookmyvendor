# --- Server Setup ---
server.port=8081

# --- Spring JPA & Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Database Connection (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/bmv?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=pranava
spring.datasource.password=11282004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

## --- Entity Scanning (optional if packages differ) ---
#spring.jpa.packages-to-scan=com.yourproject.entity

# --- JPA Logging ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- Timezone Handling ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Application Info (optional) ---
spring.application.name=BookMyVendor

# --- Other Common Settings ---
spring.datasource.initialization-mode=always
spring.datasource.continue-on-error=true

